<script>
const clean = s => (s ?? '').toString().trim();

// Remove the country code; numbers shorter than 10 digits are kept as they are
function cleanPhone(v) {
  let s = clean(v);
  if (!s || /^\d{10}$/.test(s)) return s;
  let d = s.includes(' ') ? s.slice(s.indexOf(' ') + 1).replace(/\D/g, '') : s.replace(/\D/g, '');
  while (d.length > 10) {
    const c = ['971', '91', '1'].find(c => d.startsWith(c) && d.length - c.length >= 9);
    if (!c) break;
    d = d.slice(c.length);
  }
  return d;
}

function phonesIn(text) {
  return (text.match(/\d{10,}/g) || []).map(d => d.slice(-10));
}

// Same QL / MS / MD rules as the Leads Dashboard
const MS_STATUSES = new Set([
  'Meeting Done', 'Meeting Scheduled', 'Meeting Postponed', 'Meeting Done - Sep MS', 'Meeting Done - Aug MS',
  'Meeting Done - Jul MS', 'Meeting Incomplete', 'Meeting Done on Sep',
]);
const MD_STATUSES = new Set([
  'Meeting Done', 'Meeting Done - Sep MS', 'Meeting Done - Aug MS', 'Meeting Done - Jul MS', 'Meeting Done on Sep',
]);

const META_SOURCES = new Set(['meta', 'fb lead ads', 'online paid - meta']);
const CITIES = ['Bangalore', 'Chennai', 'Coimbatore'];
// Spend from campaigns without a city code is split across the cities
const ALL_CITIES_SPLIT = { Bangalore: 0.4, Chennai: 0.4, Coimbatore: 0.2 };
// Campaigns that bring no leads; their spend is left out of every view
const NON_LEAD_CAMPAIGN = /sofa|rambha|ramba-video|page like|brand film/i;

// Campaign and ad names are matched ignoring capitals, spaces, hyphens, underscores and "+" (a space in tracking links)
const key = s => clean(s).toLowerCase().replace(/[\s\-_+]+/g, '');

function platformOf(source) {
  const s = clean(source).toLowerCase();
  if (META_SOURCES.has(s)) return 'Meta';
  if (s === 'google') return 'Google';
  return null;
}

function cityFromText(text) {
  const t = clean(text).toLowerCase();
  if (/bangalore|bengaluru/.test(t)) return 'Bangalore';
  if (/chennai|சென்னை/.test(t)) return 'Chennai';
  if (/coimbatore/.test(t)) return 'Coimbatore';
  return null;
}

// City code in a campaign or ad set name (BEN/BLR, CHE/Chennai, CBE)
function cityFromName(name) {
  const t = '_' + clean(name).toLowerCase().replace(/[\s\-]+/g, '_') + '_';
  if (/_(ben|blr|bangalore|bengaluru)_/.test(t)) return 'Bangalore';
  if (/_(che|chennai)_/.test(t)) return 'Chennai';
  if (/_(cbe|coimbatore)_/.test(t)) return 'Coimbatore';
  return null;
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const pct = (a, b) => (b ? Math.round(100 * a / b) : 0) + '%';
const per = (spend, n) => inr(n ? spend / n : 0);

let LEADS = [], SPEND = [], view = 'location';

function loadLeads(text, callCenter) {
  const cc = Papa.parse(callCenter, { header: true, skipEmptyLines: true }).data;
  const phones = rows => new Set(rows.flatMap(r => phonesIn(clean(r['Phone number']))));
  const QL = phones(cc);
  const MS = phones(cc.filter(r => MS_STATUSES.has(clean(r['Meeting Status']))));
  const MD = phones(cc.filter(r => MD_STATUSES.has(clean(r['Meeting Status']))));
  const rows = Papa.parse(text, { header: true, skipEmptyLines: true, transformHeader: h => h.replace(/^﻿/, '').trim() }).data;
  LEADS = rows.map(r => {
    const platform = platformOf(r['Contact Source']);
    if (!platform) return null;
    const ph = phonesIn(cleanPhone(r['Phone Number']));
    const has = set => ph.some(p => set.has(p));
    const stage = clean(r['Contact Stage']);
    const leadForm = clean(r['Contact Source']).toLowerCase() === 'fb lead ads';
    return {
      date: clean(r['Created On Date']) || clean(r['Created On']).slice(0, 10),
      platform,
      city: cityFromText(r['Store Location']) || cityFromText(r['Property City']),
      campaign: clean(leadForm ? r['Campaign'] : r['Source Campaign']),
      ad: clean(leadForm ? r['Ad Name'] : r['Source Content']),
      ql: has(QL) || stage === 'Quotation Sent',
      ms: has(MS),
      md: has(MD),
      natc: stage === 'Not able to Connect',
    };
  }).filter(Boolean);
}

function loadSpend(text) {
  SPEND = Papa.parse(text, { header: true, skipEmptyLines: true }).data
    .filter(r => !NON_LEAD_CAMPAIGN.test(r['Campaign']))
    .map(r => ({
      date: r['Date'], platform: r['Platform'], campaign: clean(r['Campaign']),
      adset: clean(r['Ad Set']), ad: clean(r['Ad']), spend: Number(r['Spend']) || 0,
      city: cityFromName(r['Ad Set']) || cityFromName(r['Campaign']),
    }));
  // Some leads carry the ad set name as their campaign; point those to the ad set's campaign
  const campaigns = new Set(SPEND.map(s => key(s.campaign)));
  const adsetCampaign = new Map(SPEND.filter(s => s.adset).map(s => [key(s.adset), s.campaign]));
  LEADS.forEach(l => {
    const k = key(l.campaign);
    if (k && !campaigns.has(k) && adsetCampaign.has(k)) l.campaign = adsetCampaign.get(k);
  });
}

function inRange(d) {
  const from = $('dFrom').value, to = $('dTo').value;
  return (!from || d >= from) && (!to || d <= to);
}

// Totals for a group of leads plus its spend
function stats(leads, spend) {
  return {
    lsq: leads.length,
    ql: leads.filter(l => l.ql).length,
    ms: leads.filter(l => l.ms).length,
    md: leads.filter(l => l.md).length,
    natc: leads.filter(l => l.natc).length,
    spend,
  };
}

const HEADS = ['LSQ Leads', 'QL', 'MS', 'MD', 'Amount Spent', 'CPL', 'CPQL', 'CPMS', 'CPMD', 'QL%', 'MS%', 'MD%'];
const ratio = (a, b) => (b ? a / b : 0);

// Each metric as [number, kind]; kind decides how it is shown and how Excel formats it
function metrics(s, natc) {
  const m = [[s.lsq, 'n'], [s.ql, 'n'], [s.ms, 'n'], [s.md, 'n'],
    [s.spend, 'inr'], [ratio(s.spend, s.lsq), 'inr'], [ratio(s.spend, s.ql), 'inr'], [ratio(s.spend, s.ms), 'inr'], [ratio(s.spend, s.md), 'inr'],
    [ratio(s.ql, s.lsq), 'pct'], [ratio(s.ms, s.ql), 'pct'], [ratio(s.md, s.ms), 'pct']];
  if (natc) m.push([s.natc, 'n'], [ratio(s.natc, s.lsq), 'pct']);
  return m;
}
const show = ([v, kind]) => kind === 'inr' ? inr(v) : kind === 'pct' ? Math.round(100 * v) + '%' : v.toLocaleString('en-IN');
const texts = (label, s, natc) => [label, ...metrics(s, natc).map(show)];

// Column filters per table: FILTERS[tableId][column] = Set of the values left ticked
const FILTERS = {};
// What each table currently shows, for the Excel export
const SHOWN = {};

const passes = (t, f, skipFirst) => Object.entries(f).every(([c, set]) => (skipFirst && c === '0') || set.has(t[c]));

// Applies the filters; returns the visible rows (city tables keep their platform rows under each city) and the total
function applyFilters(spec) {
  const f = FILTERS[spec.id] || (FILTERS[spec.id] = {});
  if (spec.groups) {
    const groups = spec.groups.map(g => {
      if (f[0] && !f[0].has(g.label)) return null;
      const subs = g.subs.filter(r => (!f[0] || f[0].has(r.label)) && passes(texts(r.label, r.s, spec.natc), f, true));
      return subs.length ? { label: g.label, s: subs.reduce((a, r) => add(a, r.s), ZERO), subs } : null;
    }).filter(Boolean);
    return { groups, total: groups.reduce((a, g) => add(a, g.s), ZERO) };
  }
  const rows = spec.rows.filter(r => passes(texts(r.label, r.s, spec.natc), f));
  return { rows, total: rows.reduce((a, r) => add(a, r.s), ZERO) };
}

// The values offered in a column's filter list
function options(spec, col) {
  if (spec.groups && col === 0) return spec.groups.map(g => g.label).concat(['Google', 'Meta']);
  const rows = spec.groups ? spec.groups.flatMap(g => g.subs) : spec.rows;
  const list = rows.map(r => ({ t: texts(r.label, r.s, spec.natc)[col], v: col ? metrics(r.s, spec.natc)[col - 1][0] : 0 }));
  const seen = new Map();
  list.forEach(o => { if (!seen.has(o.t)) seen.set(o.t, o.v); });
  const keys = [...seen.keys()];
  return col ? keys.sort((a, b) => seen.get(a) - seen.get(b)) : keys;
}

function cells(s, natc, total) {
  const c = metrics(s, natc).map(show);
  const line = total ? 'border-brand-forest/20' : 'border-brand-beige';
  return c.map((v, i) => {
    const pad = i === 4 ? 'px-4' : 'px-3';
    const weight = i === 4 && !total ? ' font-semibold' : '';
    const edge = i === c.length - 1 ? '' : ` border-r ${line}`;
    return `<td class="py-2.5 ${pad} text-right${edge}${weight}">${v}</td>`;
  }).join('');
}

const FILTER_ICON = '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M3 4h14l-5.5 6.5V16l-3 1.5v-7L3 4z"/></svg>';

function table(spec) {
  const heads = [spec.title, ...HEADS].concat(spec.natc ? ['NATC', spec.natcLabel || 'NATC %'] : []);
  const f = FILTERS[spec.id] || {};
  const th = heads.map((h, i) => {
    const on = f[i] ? ' text-brand-orange' : ' text-white/70 hover:text-white';
    return `<th scope="col" class="py-3 ${i === 0 || i === 5 ? 'px-4' : 'px-3'} ${i === 0 ? 'text-left' : 'text-right'}${i === 5 ? ' font-bold' : ''}${i === heads.length - 1 ? '' : ' border-r border-white/10'}${i === 0 && spec.title === 'Ads' ? ' min-w-[280px]' : ''}">
      <span class="inline-flex items-center gap-1.5">${h}<button type="button" class="filter-btn${on}" data-table="${spec.id}" data-col="${i}" aria-label="Filter ${h}" title="Filter ${h}">${FILTER_ICON}</button></span></th>`;
  }).join('');
  const shown = applyFilters(spec);
  SHOWN[spec.id] = { spec, shown };
  const td0 = 'py-2.5 px-4 text-left border-r border-brand-beige';
  let tr;
  if (shown.groups) {
    tr = shown.groups.map(g =>
      `<tr class="bg-brand-sage font-bold"><td class="${td0} text-sm font-semibold">${esc(g.label)}</td>${cells(g.s, spec.natc)}</tr>` +
      g.subs.map(r => `<tr class="${r.label === 'Meta' ? 'bg-brand-ivoryLight' : 'bg-white'}"><td class="${td0} pl-8 font-medium text-gray-700">${esc(r.label)}</td>${cells(r.s, spec.natc)}</tr>`).join('')
    ).join('');
  } else {
    tr = shown.rows.map((r, n) =>
      `<tr class="${n % 2 ? 'bg-brand-ivoryLight' : 'bg-white'}"><td class="${td0} font-semibold">${esc(r.label)}</td>${cells(r.s, spec.natc)}</tr>`).join('');
  }
  const empty = !(shown.groups || shown.rows).length;
  if (empty) tr = `<tr class="bg-white"><td colspan="${heads.length}" class="py-4 px-4 text-left text-gray-500 italic">No rows match the filters.</td></tr>`;
  const foot = `<tfoot class="bg-brand-beige font-extrabold text-brand-forest border-t-2 border-brand-orange text-xs"><tr><td class="py-3 px-4 text-left border-r border-brand-forest/20">Grand Total</td>${cells(shown.total, spec.natc, true)}</tr></tfoot>`;
  const active = Object.keys(f).length;
  return `<div class="flex flex-wrap items-center justify-end gap-2 mb-2">
      ${active ? `<button type="button" class="clear-filters px-3 py-1.5 text-xs font-medium rounded-lg text-brand-forest bg-white border border-brand-beige hover:border-brand-orange hover:bg-brand-peach hover:text-brand-orange transition-colors" data-table="${spec.id}">Clear filters (${active})</button>` : ''}
      <button type="button" class="export px-3 py-1.5 text-xs font-semibold rounded-lg text-white bg-brand-forest hover:bg-brand-orange transition-colors inline-flex items-center gap-1.5" data-table="${spec.id}">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>Export to Excel</button>
    </div>
    <div class="bg-white border border-brand-beige rounded-xl shadow-sm overflow-hidden mb-3"><div class="table-container overflow-x-auto">
    <table class="dashboard-table w-full text-xs text-left border-collapse whitespace-nowrap">
    <thead class="bg-brand-forest text-white uppercase tracking-wider text-[11px] font-semibold border-b-2 border-brand-orange"><tr>${th}</tr></thead>
    <tbody class="divide-y divide-brand-beige text-brand-forest">${tr}</tbody>${foot}</table></div></div>`;
}

const note = text => `<p class="text-xs text-gray-500 italic pl-1 mb-4 flex items-center"><svg class="w-3.5 h-3.5 text-brand-orange mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>${text}</p>`;
const heading = (text, dot) => `<div class="mb-2.5 mt-2 flex items-center"><h2 class="text-base font-bold text-brand-forest flex items-center"><span class="w-2.5 h-2.5 rounded-full ${dot} inline-block mr-2"></span>${text}</h2></div>`;

const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
const add = (a, b) => ({ lsq: a.lsq + b.lsq, ql: a.ql + b.ql, ms: a.ms + b.ms, md: a.md + b.md, natc: a.natc + b.natc, spend: a.spend + b.spend });
const ZERO = { lsq: 0, ql: 0, ms: 0, md: 0, natc: 0, spend: 0 };

function locationView(leads, spend) {
  // Spend per city and platform; campaigns without a city code are split 40 / 40 / 20
  const citySpend = {};
  spend.forEach(s => {
    const shares = s.city ? { [s.city]: 1 } : ALL_CITIES_SPLIT;
    for (const [city, share] of Object.entries(shares)) {
      const k = city + '|' + s.platform;
      citySpend[k] = (citySpend[k] || 0) + s.spend * share;
    }
  });
  const groups = CITIES.map(city => ({
    label: city,
    subs: ['Google', 'Meta'].map(p => ({
      label: p, s: stats(leads.filter(l => l.city === city && l.platform === p), citySpend[city + '|' + p] || 0),
    })),
  }));
  const noCity = leads.filter(l => !l.city).length;
  return table({ id: 'location', title: 'Location', natc: true, groups }) +
    (noCity ? note(`${noCity} lead${noCity > 1 ? 's have' : ' has'} no Store Location or Property City and ${noCity > 1 ? 'are' : 'is'} not shown.`) : '');
}

function platformView(leads, spend) {
  const rows = ['Google', 'Meta'].map(p => ({
    label: p, s: stats(leads.filter(l => l.platform === p), sum(spend.filter(s => s.platform === p), s => s.spend)),
  }));
  return table({ id: 'platform', title: 'Platform', natc: false, rows });
}

// Rows for every name that has spend or leads; the Porter name is shown when both exist
function groupRows(leads, spend, leadName, spendName) {
  const groups = new Map();
  const get = name => {
    const k = key(name);
    if (!groups.has(k)) groups.set(k, { label: name, leads: [], spend: 0 });
    return groups.get(k);
  };
  spend.forEach(s => { if (spendName(s)) { const g = get(spendName(s)); g.label = spendName(s); g.spend += s.spend; } });
  leads.forEach(l => { if (leadName(l)) get(leadName(l)).leads.push(l); });
  return [...groups.values()].map(g => ({ label: g.label, s: stats(g.leads, g.spend) }));
}

function campaignView(leads, spend) {
  const byName = (a, b) => a.label.localeCompare(b.label);
  return ['Meta', 'Google'].map(p => {
    const rows = groupRows(leads.filter(l => l.platform === p), spend.filter(s => s.platform === p), l => l.campaign, s => s.campaign)
      .sort(byName);
    const unmatched = leads.filter(l => l.platform === p && !l.campaign).length;
    return heading(p, p === 'Meta' ? 'bg-brand-orange' : 'bg-brand-forest') +
      table({ id: 'campaign-' + p.toLowerCase(), title: p, natc: p === 'Meta', rows, file: p + ' Campaigns' }) +
      (unmatched ? note(`${unmatched} ${p} lead${unmatched > 1 ? 's have' : ' has'} no campaign name and ${unmatched > 1 ? 'are' : 'is'} not shown here.`) : '');
  }).join('');
}

function adsView(leads, spend) {
  const rows = groupRows(leads.filter(l => l.platform === 'Meta'), spend.filter(s => s.platform === 'Meta'), l => l.ad, s => s.ad)
    .sort((a, b) => b.s.md - a.s.md || b.s.ms - a.s.ms || b.s.lsq - a.s.lsq);
  const unmatched = leads.filter(l => l.platform === 'Meta' && !l.ad).length;
  return table({ id: 'ads', title: 'Ads', natc: true, natcLabel: 'L to NATC', rows }) +
    (unmatched ? note(`${unmatched} Meta lead${unmatched > 1 ? 's have' : ' has'} no ad name and ${unmatched > 1 ? 'are' : 'is'} not shown here.`) : '');
}

function render() {
  const leads = LEADS.filter(l => inRange(l.date));
  const spend = SPEND.filter(s => inRange(s.date));
  const views = { location: locationView, platform: platformView, campaign: campaignView, ads: adsView };
  $('view').innerHTML = views[view](leads, spend);
}

// ---------- Excel export ----------
// Rupees with Indian digit grouping (₹5,62,602 / ₹55,50,378)
const XL_FORMAT = { n: '#,##0', inr: '[>=10000000]"₹"##\\,##\\,##\\,##0;[>=100000]"₹"##\\,##\\,##0;"₹"##,##0', pct: '0%' };

function exportTable(id) {
  const { spec, shown } = SHOWN[id];
  const heads = [spec.title, ...HEADS].concat(spec.natc ? ['NATC', spec.natcLabel || 'NATC %'] : []);
  const line = (label, s) => [{ v: label, t: 's' }, ...metrics(s, spec.natc).map(([v, kind]) =>
    ({ v: kind === 'inr' ? Math.round(v) : v, t: 'n', z: XL_FORMAT[kind] }))];
  const aoa = [heads.map(h => ({ v: h, t: 's' }))];
  if (shown.groups) shown.groups.forEach(g => { aoa.push(line(g.label, g.s)); g.subs.forEach(r => aoa.push(line('   ' + r.label, r.s))); });
  else shown.rows.forEach(r => aoa.push(line(r.label, r.s)));
  aoa.push(line('Grand Total', shown.total));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = heads.map((h, i) => ({ wch: i ? Math.max(10, h.length + 2) : Math.min(70, Math.max(14, ...aoa.map(r => String(r[0].v).length + 2))) }));
  const wb = XLSX.utils.book_new();
  const name = spec.file || spec.title;
  XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  XLSX.writeFile(wb, `Magick Home ${name} ${$('dFrom').value} to ${$('dTo').value}.xlsx`);
}

// ---------- Column filter list ----------
let popFor = null;

function openFilter(btn) {
  const id = btn.dataset.table, col = Number(btn.dataset.col);
  const spec = SHOWN[id].spec;
  const opts = options(spec, col);
  const set = (FILTERS[id] || {})[col];
  const pop = $('filterPop');
  const item = 'flex items-center gap-2 px-2 py-1 rounded hover:bg-brand-peach cursor-pointer text-xs text-brand-forest whitespace-nowrap';
  pop.innerHTML =
    `<input type="search" id="popSearch" placeholder="Search" class="w-full mb-1.5 px-2 py-1 text-xs border border-brand-beige rounded focus:border-brand-orange focus:ring-1 focus:ring-brand-orange">` +
    `<label class="${item} font-semibold border-b border-brand-beige mb-1 pb-1.5"><input type="checkbox" id="popAll" class="text-brand-forest rounded"> Select all</label>` +
    `<div id="popList" class="max-h-64 overflow-auto">` +
    opts.map(o => `<label class="${item}" data-text="${esc(o.toLowerCase())}"><input type="checkbox" class="pop-opt text-brand-forest rounded" value="${esc(o)}" ${!set || set.has(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('') +
    `</div>`;
  popFor = { id, col, opts };
  syncAll();
  const r = btn.getBoundingClientRect();
  pop.hidden = false;
  const w = pop.offsetWidth;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + window.scrollX - 8)) + 'px';
  pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function syncAll() {
  const boxes = [...document.querySelectorAll('#popList .pop-opt')];
  const on = boxes.filter(b => b.checked).length;
  $('popAll').checked = on === boxes.length;
  $('popAll').indeterminate = on > 0 && on < boxes.length;
}

function applyPop() {
  const { id, col, opts } = popFor;
  const ticked = [...document.querySelectorAll('#popList .pop-opt:checked')].map(b => b.value);
  const f = FILTERS[id] || (FILTERS[id] = {});
  if (ticked.length === opts.length) delete f[col]; else f[col] = new Set(ticked);
  render();
}

function closePop() { $('filterPop').hidden = true; popFor = null; }

$('filterPop').addEventListener('change', e => {
  if (e.target.id === 'popAll') document.querySelectorAll('#popList .pop-opt').forEach(b => {
    if (b.closest('label').style.display !== 'none') b.checked = e.target.checked;
  });
  syncAll();
  applyPop();
});
$('filterPop').addEventListener('input', e => {
  if (e.target.id !== 'popSearch') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#popList label').forEach(l => { l.style.display = l.dataset.text.includes(q) ? '' : 'none'; });
});
document.addEventListener('click', e => {
  const fb = e.target.closest('.filter-btn');
  if (fb) { e.stopPropagation(); popFor && popFor.id === fb.dataset.table && popFor.col === Number(fb.dataset.col) ? closePop() : openFilter(fb); return; }
  if (!e.target.closest('#filterPop')) closePop();
  const ex = e.target.closest('.export');
  if (ex) exportTable(ex.dataset.table);
  const cf = e.target.closest('.clear-filters');
  if (cf) { delete FILTERS[cf.dataset.table]; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

// Numbers change with the dates, so number filters are cleared; name filters are kept
function onDatesChanged() {
  for (const f of Object.values(FILTERS)) for (const c of Object.keys(f)) if (c !== '0') delete f[c];
  closePop();
  render();
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  view = t.dataset.view;
  closePop();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b === t)));
  render();
}));
$('dFrom').addEventListener('change', onDatesChanged);
$('dTo').addEventListener('change', onDatesChanged);

let DATES = [];
$('reset').addEventListener('click', () => { $('dFrom').value = DATES[0]; $('dTo').value = DATES[DATES.length - 1]; onDatesChanged(); });

const getText = url => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject(url));

Promise.all([getText('data/leads.csv'), getText('data/call-center.csv'), getText('data/ad-spend.csv')])
  .then(([leads, callCenter, spend]) => {
    loadLeads(leads, callCenter);
    loadSpend(spend);
    DATES = LEADS.map(l => l.date).concat(SPEND.map(s => s.date)).filter(Boolean).sort();
    $('dFrom').min = $('dTo').min = DATES[0];
    $('dFrom').max = $('dTo').max = DATES[DATES.length - 1];
    $('dFrom').value = DATES[0];
    $('dTo').value = DATES[DATES.length - 1];
    $('status').textContent = `Data from ${DATES[0]} to ${DATES[DATES.length - 1]}`;
    render();
  })
  .catch(url => { $('status').textContent = `Could not load ${url}`; });
</script>
