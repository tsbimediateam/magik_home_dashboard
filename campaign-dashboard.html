<style>

<body class="min-h-screen flex flex-col font-sans antialiased text-brand-forest">

<main class="flex-1 w-full px-6 lg:px-8 py-5 max-w-[1920px] mx-auto">
  <section class="bg-white rounded-xl border border-brand-beige p-4 mb-5 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex items-center space-x-2">
          <label class="text-xs font-semibold uppercase tracking-wider text-brand-forest" for="dFrom">From</label>
          <input id="dFrom" type="date" class="w-40 px-3 py-1.5 text-sm font-medium bg-white border border-brand-beige rounded-lg focus:border-brand-orange focus:ring-1 focus:ring-brand-orange text-brand-forest">

          <input id="dTo" type="date" class="w-40 px-3 py-1.5 text-sm font-medium bg-white border border-brand-beige rounded-lg focus:border-brand-orange focus:ring-1 focus:ring-brand-orange text-brand-forest">

        <button id="reset" type="button" class="px-3.5 py-1.5 text-sm font-medium rounded-lg text-brand-forest bg-brand-ivory border border-brand-beige hover:border-brand-orange hover:bg-brand-peach hover:text-brand-orange transition-colors">Reset dates</button>
      </div>

        <svg class="w-3.5 h-3.5 mr-1.5 text-brand-orange" fill="currentColor" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" fill-rule="evenodd"></path></svg>
        <span id="status">Loading…</span>

  <nav aria-label="Dashboard views" role="tablist" class="flex flex-wrap items-center gap-2 mb-4">
    <button type="button" role="tab" data-view="location" aria-selected="true" class="tab px-6 py-2 text-sm font-semibold rounded-lg bg-white text-brand-forest border border-brand-beige hover:bg-brand-peach hover:text-brand-orange transition-all duration-150">Location</button>
    <button type="button" role="tab" data-view="platform" aria-selected="false" class="tab px-6 py-2 text-sm font-semibold rounded-lg bg-white text-brand-forest border border-brand-beige hover:bg-brand-peach hover:text-brand-orange transition-all duration-150">Platform</button>
    <button type="button" role="tab" data-view="campaign" aria-selected="false" class="tab px-6 py-2 text-sm font-semibold rounded-lg bg-white text-brand-forest border border-brand-beige hover:bg-brand-peach hover:text-brand-orange transition-all duration-150">Campaign</button>
    <button type="button" role="tab" data-view="ads" aria-selected="false" class="tab px-6 py-2 text-sm font-semibold rounded-lg bg-white text-brand-forest border border-brand-beige hover:bg-brand-peach hover:text-brand-orange transition-all duration-150">Ads</button>
  </nav>

  <div id="view"></div>
</main>

<script>
const clean = s => (s ?? '').toString().trim();

// Remove the country code; numbers shorter than 10 digits are kept as they are
function cleanPhone(v) {
  let s = clean(v);
  if (!s || /^\d{10}$/.test(s)) return s;
  let d = s.includes(' ') ? s.slice(s.indexOf(' ') + 1).replace(/\D/g, '') : s.replace(/\D/g, '');
  while (d.length > 10) {
    const c = ['971', '91', '1'].find(c => d.startsWith(c) && d.length - c.length >= 9);
    if (!c) break;
    d = d.slice(c.length);
  }
  return d;
}

function phonesIn(text) {
  return (text.match(/\d{10,}/g) || []).map(d => d.slice(-10));
}

// Same QL / MS / MD rules as the Leads Dashboard
const MS_STATUSES = new Set([
  'Meeting Done', 'Meeting Scheduled', 'Meeting Postponed', 'Meeting Done - Sep MS', 'Meeting Done - Aug MS',
  'Meeting Done - Jul MS', 'Meeting Incomplete', 'Meeting Done on Sep',
]);
const MD_STATUSES = new Set([
  'Meeting Done', 'Meeting Done - Sep MS', 'Meeting Done - Aug MS', 'Meeting Done - Jul MS', 'Meeting Done on Sep',
]);

const META_SOURCES = new Set(['meta', 'fb lead ads', 'online paid - meta']);
const CITIES = ['Bangalore', 'Chennai', 'Coimbatore'];
// Spend from campaigns without a city code is split across the cities
const ALL_CITIES_SPLIT = { Bangalore: 0.4, Chennai: 0.4, Coimbatore: 0.2 };
// Campaigns that bring no leads; their spend is left out of every view
const NON_LEAD_CAMPAIGN = /sofa|rambha|ramba-video|page like|brand film/i;

// Campaign and ad names are matched ignoring capitals, spaces, hyphens, underscores and "+" (a space in tracking links)
const key = s => clean(s).toLowerCase().replace(/[\s\-_+]+/g, '');

function platformOf(source) {
  const s = clean(source).toLowerCase();
  if (META_SOURCES.has(s)) return 'Meta';
  if (s === 'google') return 'Google';
  return null;
}

function cityFromText(text) {
  const t = clean(text).toLowerCase();
  if (/bangalore|bengaluru/.test(t)) return 'Bangalore';
  if (/chennai|சென்னை/.test(t)) return 'Chennai';
  if (/coimbatore/.test(t)) return 'Coimbatore';
  return null;
}

// City code in a campaign or ad set name (BEN/BLR, CHE/Chennai, CBE)
function cityFromName(name) {
  const t = '_' + clean(name).toLowerCase().replace(/[\s\-]+/g, '_') + '_';
  if (/_(ben|blr|bangalore|bengaluru)_/.test(t)) return 'Bangalore';
  if (/_(che|chennai)_/.test(t)) return 'Chennai';
  if (/_(cbe|coimbatore)_/.test(t)) return 'Coimbatore';
  return null;
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const pct = (a, b) => (b ? Math.round(100 * a / b) : 0) + '%';
const per = (spend, n) => inr(n ? spend / n : 0);

let LEADS = [], SPEND = [], view = 'location';

function loadLeads(text, callCenter) {
  const cc = Papa.parse(callCenter, { header: true, skipEmptyLines: true }).data;
  const phones = rows => new Set(rows.flatMap(r => phonesIn(clean(r['Phone number']))));
  const QL = phones(cc);
  const MS = phones(cc.filter(r => MS_STATUSES.has(clean(r['Meeting Status']))));
  const MD = phones(cc.filter(r => MD_STATUSES.has(clean(r['Meeting Status']))));
  const rows = Papa.parse(text, { header: true, skipEmptyLines: true, transformHeader: h => h.replace(/^﻿/, '').trim() }).data;
  LEADS = rows.map(r => {
    const platform = platformOf(r['Contact Source']);
    if (!platform) return null;
    const ph = phonesIn(cleanPhone(r['Phone Number']));
    const has = set => ph.some(p => set.has(p));
    const stage = clean(r['Contact Stage']);
    const leadForm = clean(r['Contact Source']).toLowerCase() === 'fb lead ads';
    return {
      date: clean(r['Created On Date']) || clean(r['Created On']).slice(0, 10),
      platform,
      city: cityFromText(r['Store Location']) || cityFromText(r['Property City']),
      campaign: clean(leadForm ? r['Campaign'] : r['Source Campaign']),
      ad: clean(leadForm ? r['Ad Name'] : r['Source Content']),
      ql: has(QL) || stage === 'Quotation Sent',
      ms: has(MS),
      md: has(MD),
      natc: stage === 'Not able to Connect',
    };
  }).filter(Boolean);
}

function loadSpend(text) {
  SPEND = Papa.parse(text, { header: true, skipEmptyLines: true }).data
    .filter(r => !NON_LEAD_CAMPAIGN.test(r['Campaign']))
    .map(r => ({
      date: r['Date'], platform: r['Platform'], campaign: clean(r['Campaign']),
      adset: clean(r['Ad Set']), ad: clean(r['Ad']), spend: Number(r['Spend']) || 0,
      city: cityFromName(r['Ad Set']) || cityFromName(r['Campaign']),
    }));
  // Some leads carry the ad set name as their campaign; point those to the ad set's campaign
  const campaigns = new Set(SPEND.map(s => key(s.campaign)));
  const adsetCampaign = new Map(SPEND.filter(s => s.adset).map(s => [key(s.adset), s.campaign]));
  LEADS.forEach(l => {
    const k = key(l.campaign);
    if (k && !campaigns.has(k) && adsetCampaign.has(k)) l.campaign = adsetCampaign.get(k);
  });
}

function inRange(d) {
  const from = $('dFrom').value, to = $('dTo').value;
  return (!from || d >= from) && (!to || d <= to);
}

// Totals for a group of leads plus its spend
function stats(leads, spend) {
  return {
    lsq: leads.length,
    ql: leads.filter(l => l.ql).length,
    ms: leads.filter(l => l.ms).length,
    md: leads.filter(l => l.md).length,
    natc: leads.filter(l => l.natc).length,
    spend,
  };
}

function cells(s, natc, total) {
  const c = [s.lsq, s.ql, s.ms, s.md, inr(s.spend), per(s.spend, s.lsq), per(s.spend, s.ql), per(s.spend, s.ms),
    per(s.spend, s.md), pct(s.ql, s.lsq), pct(s.ms, s.ql), pct(s.md, s.ms)];
  if (natc) c.push(s.natc, pct(s.natc, s.lsq));
  const line = total ? 'border-brand-forest/20' : 'border-brand-beige';
  return c.map((v, i) => {
    const pad = i === 4 ? 'px-4' : 'px-3';
    const weight = i === 4 && !total ? ' font-semibold' : '';
    const edge = i === c.length - 1 ? '' : ` border-r ${line}`;
    return `<td class="py-2.5 ${pad} text-right${edge}${weight}">${typeof v === 'number' ? v.toLocaleString('en-IN') : v}</td>`;
  }).join('');
}

// Row styles from the design: city rows in sage, platform rows indented, Grand Total in the footer
const ROW = {
  group: { tr: 'bg-brand-sage font-bold', td: 'text-sm font-semibold' },
  sub: { tr: 'bg-white', td: 'pl-8 font-medium text-gray-700' },
  '': { tr: 'bg-white', td: 'font-semibold' },
};

function table(firstHeader, rows, natc, natcLabel = 'NATC %') {
  const heads = [firstHeader, 'LSQ Leads', 'QL', 'MS', 'MD', 'Amount Spent', 'CPL', 'CPQL', 'CPMS', 'CPMD', 'QL%', 'MS%', 'MD%']
    .concat(natc ? ['NATC', natcLabel] : []);
  const th = heads.map((h, i) => `<th scope="col" class="py-3 ${i === 0 || i === 5 ? 'px-4' : 'px-3'} ${i === 0 ? 'text-left' : 'text-right'}${i === 5 ? ' font-bold' : ''}${i === heads.length - 1 ? '' : ' border-r border-white/10'}${i === 0 && firstHeader === 'Ads' ? ' min-w-[280px]' : ''}">${h}</th>`).join('');
  const body = rows.filter(r => r.cls !== 'total');
  const total = rows.find(r => r.cls === 'total');
  let n = 0;
  const tr = body.map(r => {
    const st = ROW[r.cls || ''];
    // Plain rows alternate white and ivory
    const bg = r.cls ? st.tr : (n++ % 2 ? 'bg-brand-ivoryLight' : 'bg-white');
    const trClass = r.cls === 'sub' ? (r.label === 'Meta' ? 'bg-brand-ivoryLight' : 'bg-white') : r.cls ? st.tr : bg;
    return `<tr class="${trClass}"><td class="py-2.5 px-4 text-left border-r border-brand-beige ${st.td}">${esc(r.label)}</td>${cells(r.s, natc)}</tr>`;
  }).join('');
  const foot = total ? `<tfoot class="bg-brand-beige font-extrabold text-brand-forest border-t-2 border-brand-orange text-xs"><tr><td class="py-3 px-4 text-left border-r border-brand-forest/20">Grand Total</td>${cells(total.s, natc, true)}</tr></tfoot>` : '';
  return `<div class="bg-white border border-brand-beige rounded-xl shadow-sm overflow-hidden mb-3"><div class="table-container overflow-x-auto">
    <table class="dashboard-table w-full text-xs text-left border-collapse whitespace-nowrap">
    <thead class="bg-brand-forest text-white uppercase tracking-wider text-[11px] font-semibold border-b-2 border-brand-orange"><tr>${th}</tr></thead>
    <tbody class="divide-y divide-brand-beige text-brand-forest">${tr}</tbody>${foot}</table></div></div>`;
}

const note = text => `<p class="text-xs text-gray-500 italic pl-1 mb-4 flex items-center"><svg class="w-3.5 h-3.5 text-brand-orange mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>${text}</p>`;
const heading = (text, dot) => `<div class="mb-2.5 mt-2 flex items-center"><h2 class="text-base font-bold text-brand-forest flex items-center"><span class="w-2.5 h-2.5 rounded-full ${dot} inline-block mr-2"></span>${text}</h2></div>`;

const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
const add = (a, b) => ({ lsq: a.lsq + b.lsq, ql: a.ql + b.ql, ms: a.ms + b.ms, md: a.md + b.md, natc: a.natc + b.natc, spend: a.spend + b.spend });
const ZERO = { lsq: 0, ql: 0, ms: 0, md: 0, natc: 0, spend: 0 };

function locationView(leads, spend) {
  // Spend per city and platform; campaigns without a city code are split 40 / 40 / 20
  const citySpend = {};
  spend.forEach(s => {
    const shares = s.city ? { [s.city]: 1 } : ALL_CITIES_SPLIT;
    for (const [city, share] of Object.entries(shares)) {
      const k = city + '|' + s.platform;
      citySpend[k] = (citySpend[k] || 0) + s.spend * share;
    }
  });
  const rows = [];
  let total = ZERO;
  CITIES.forEach(city => {
    const subs = ['Google', 'Meta'].map(p => ({
      label: p, cls: 'sub',
      s: stats(leads.filter(l => l.city === city && l.platform === p), citySpend[city + '|' + p] || 0),
    }));
    const cityTotal = subs.reduce((a, r) => add(a, r.s), ZERO);
    total = add(total, cityTotal);
    rows.push({ label: city, cls: 'group', s: cityTotal }, ...subs);
  });
  rows.push({ label: 'Grand Total', cls: 'total', s: total });
  const noCity = leads.filter(l => !l.city).length;
  return table('Location', rows, true) +
    (noCity ? note(`${noCity} lead${noCity > 1 ? 's have' : ' has'} no Store Location or Property City and ${noCity > 1 ? 'are' : 'is'} not shown.`) : '');
}

function platformView(leads, spend) {
  const rows = ['Google', 'Meta'].map(p => ({
    label: p, s: stats(leads.filter(l => l.platform === p), sum(spend.filter(s => s.platform === p), s => s.spend)),
  }));
  rows.push({ label: 'Grand Total', cls: 'total', s: rows.reduce((a, r) => add(a, r.s), ZERO) });
  return table('Platform', rows, false);
}

// Rows for every name that has spend or leads; the Porter name is shown when both exist
function groupRows(leads, spend, leadName, spendName) {
  const groups = new Map();
  const get = name => {
    const k = key(name);
    if (!groups.has(k)) groups.set(k, { label: name, leads: [], spend: 0 });
    return groups.get(k);
  };
  spend.forEach(s => { if (spendName(s)) { const g = get(spendName(s)); g.label = spendName(s); g.spend += s.spend; } });
  leads.forEach(l => { if (leadName(l)) get(leadName(l)).leads.push(l); });
  return [...groups.values()].map(g => ({ label: g.label, s: stats(g.leads, g.spend) }));
}

function withTotal(rows) {
  return rows.concat({ label: 'Grand Total', cls: 'total', s: rows.reduce((a, r) => add(a, r.s), ZERO) });
}

function campaignView(leads, spend) {
  const byName = (a, b) => a.label.localeCompare(b.label);
  return ['Meta', 'Google'].map(p => {
    const rows = groupRows(leads.filter(l => l.platform === p), spend.filter(s => s.platform === p), l => l.campaign, s => s.campaign)
      .sort(byName);
    const unmatched = leads.filter(l => l.platform === p && !l.campaign).length;
    return heading(p, p === 'Meta' ? 'bg-brand-orange' : 'bg-brand-forest') + table(p, withTotal(rows), p === 'Meta') +
      (unmatched ? note(`${unmatched} ${p} lead${unmatched > 1 ? 's have' : ' has'} no campaign name and ${unmatched > 1 ? 'are' : 'is'} not shown here.`) : '');
  }).join('');
}

function adsView(leads, spend) {
  const rows = groupRows(leads.filter(l => l.platform === 'Meta'), spend.filter(s => s.platform === 'Meta'), l => l.ad, s => s.ad)
    .sort((a, b) => b.s.md - a.s.md || b.s.ms - a.s.ms || b.s.lsq - a.s.lsq);
  const unmatched = leads.filter(l => l.platform === 'Meta' && !l.ad).length;
  return table('Ads', withTotal(rows), true, 'L to NATC') +
    (unmatched ? note(`${unmatched} Meta lead${unmatched > 1 ? 's have' : ' has'} no ad name and ${unmatched > 1 ? 'are' : 'is'} not shown here.`) : '');
}

function render() {
  const leads = LEADS.filter(l => inRange(l.date));
  const spend = SPEND.filter(s => inRange(s.date));
  const views = { location: locationView, platform: platformView, campaign: campaignView, ads: adsView };
  $('view').innerHTML = views[view](leads, spend);
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  view = t.dataset.view;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b === t)));
  render();
}));
$('dFrom').addEventListener('change', render);
$('dTo').addEventListener('change', render);

let DATES = [];
$('reset').addEventListener('click', () => { $('dFrom').value = DATES[0]; $('dTo').value = DATES[DATES.length - 1]; render(); });

const getText = url => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject(url));

Promise.all([getText('data/leads.csv'), getText('data/call-center.csv'), getText('data/ad-spend.csv')])
  .then(([leads, callCenter, spend]) => {
    loadLeads(leads, callCenter);
    loadSpend(spend);
    DATES = LEADS.map(l => l.date).concat(SPEND.map(s => s.date)).filter(Boolean).sort();
    $('dFrom').min = $('dTo').min = DATES[0];
    $('dFrom').max = $('dTo').max = DATES[DATES.length - 1];
    $('dFrom').value = DATES[0];
    $('dTo').value = DATES[DATES.length - 1];
    $('status').textContent = `Data from ${DATES[0]} to ${DATES[DATES.length - 1]}`;
    render();
  })
  .catch(url => { $('status').textContent = `Could not load ${url}`; });
</script>
</body>
</html>
