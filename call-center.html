<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Center Data – Magik Home</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
body { margin: 0; padding: 16px; font: 14px/1.4 Arial, sans-serif; background: #fff; color: #000; }
.nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.nav h1 { font-size: 18px; margin: 0 0 0 8px; }
.nav button, .nav .btn { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid #bbb; border-radius: 4px; background: #f5f5f5; color: #000; text-decoration: none; cursor: pointer; }
.nav button:hover, .nav .btn:hover { background: #e8e8e8; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.bar input[type=search] { padding: 5px 8px; width: 260px; max-width: 100%; }
.wrap { overflow: auto; max-height: calc(100vh - 120px); border: 1px solid #ccc; }
table { border-collapse: collapse; font-size: 12px; }
th, td { border: 1px solid #ddd; padding: 4px 8px; white-space: nowrap; text-align: left; }
th { position: sticky; top: 0; background: #eee; }
#count { color: #555; }
</style>
</head>
<body>
<div class="nav">
  <button type="button" onclick="history.length > 1 ? history.back() : location.href = 'index.html'">&larr; Back</button>
  <a class="btn" href="index.html">Home</a>
  <h1>Call Center Data</h1>
</div>
<div class="bar">
  <input type="search" id="search" placeholder="Search…">
  <span id="count">Loading…</span>
</div>
<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let HEAD = [], ROWS = [];

function render() {
  const q = $('search').value.trim().toLowerCase();
  const rows = q ? ROWS.filter(r => r.some(v => v.toLowerCase().includes(q))) : ROWS;
  $('tbody').innerHTML = rows.map(r => '<tr>' + r.map(v => `<td>${esc(v)}</td>`).join('') + '</tr>').join('');
  $('count').textContent = `${rows.length.toLocaleString('en-IN')} of ${ROWS.length.toLocaleString('en-IN')} rows`;
}

$('search').addEventListener('input', render);

fetch('data/call-center.csv', { cache: 'no-store' })
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(text => {
    [HEAD, ...ROWS] = Papa.parse(text, { skipEmptyLines: true }).data;
    $('thead').innerHTML = '<tr>' + HEAD.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
    render();
  })
  .catch(() => { $('count').textContent = 'Could not load data/call-center.csv'; });
</script>
</body>
</html>
