<script>
const clean = s => (s ?? '').toString().trim();

// Remove the country code; numbers shorter than 10 digits are kept as they are
function cleanPhone(v) {
  let s = clean(v);
  if (!s || /^\d{10}$/.test(s)) return s;
  let d = s.includes(' ') ? s.slice(s.indexOf(' ') + 1).replace(/\D/g, '') : s.replace(/\D/g, '');
  while (d.length > 10) {
    const c = ['971', '91', '1'].find(c => d.startsWith(c) && d.length - c.length >= 9);
    if (!c) break;
    d = d.slice(c.length);
  }
  return d;
}

// Accepts the raw export ("Created On" = "YYYY-MM-DD hh:mm:ss AM") or one already split into date and time
function splitCreated(r) {
  if (r['Created On Date']) return [clean(r['Created On Date']), clean(r['Created On Time'])];
  const s = clean(r['Created On']), i = s.indexOf(' ');
  return i < 0 ? [s, ''] : [s.slice(0, i), s.slice(i + 1)];
}

const HEADERS = [
  'Sr. No.', 'Date', 'Time',
  'Contact First Name', 'Contact Last Name', 'Email ID', 'Phone Number', 'Contact Source',
  'Source Campaign', 'Source Medium', 'Source Content', 'Contact Stage', 'Property City',
  'Reason for Not able to Connect', 'Reason for Dead Lead',
  'LSQ', 'QL', 'MS', 'MD',
];

// Phone numbers in the call center sheet (a cell can hold several, e.g. "98430 / 86100")
let CALL_CENTER_PHONES = new Set();
// Call center phones whose Meeting Status is one of these
const MS_STATUSES = new Set([
  'Meeting Done', 'Meeting Scheduled', 'Meeting Postponed', 'Meeting Done - Sep MS', 'Meeting Done - Aug MS',
  'Meeting Done - Jul MS', 'Meeting Incomplete', 'Meeting Done on Sep',
]);
let MS_PHONES = new Set();
// Call center phones whose meeting was done
const MD_STATUSES = new Set([
  'Meeting Done', 'Meeting Done - Sep MS', 'Meeting Done - Aug MS', 'Meeting Done - Jul MS', 'Meeting Done on Sep',
]);
let MD_PHONES = new Set();

function phonesIn(text) {
  return (text.match(/\d{10,}/g) || []).map(d => d.slice(-10));
}

// "google" and "Google" are the same source
const cleanSource = v => clean(v).toLowerCase() === 'google' ? 'Google' : clean(v);

function toRow(r, i) {
  const [date, time] = splitCreated(r);
  const phone = cleanPhone(r['Phone Number']);
  // Leads at "Quotation Sent" count as quality leads even without a call center match
  const ql = phonesIn(phone).some(p => CALL_CENTER_PHONES.has(p)) || clean(r['Contact Stage']) === 'Quotation Sent' ? '1' : '';
  const ms = phonesIn(phone).some(p => MS_PHONES.has(p)) ? '1' : '';
  const md = phonesIn(phone).some(p => MD_PHONES.has(p)) ? '1' : '';
  return [
    String(i + 1), date, time,
    clean(r['Contact First Name']), clean(r['Contact Last Name']), clean(r['Email ID']),
    phone, cleanSource(r['Contact Source']),
    clean(r['Source Campaign']), clean(r['Source Medium']), clean(r['Source Content']),
    clean(r['Contact Stage']), clean(r['Property City']),
    clean(r['Reason for Not able to Connect']), clean(r['Reason for Dead Lead']),
    '1', ql, ms, md,
  ];
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n.toLocaleString('en-IN');
const DATE = 1, SOURCE = 7, BLANK = '(Blank)', PAGE = 50;
let ROWS = [], VIEW = [], SOURCES = [], page = 0, filterCol = null, sortCol = null, sortAsc = true;

// Pill colours for Contact Source, from the design
const PILL = {
  'Meta': 'bg-surface-container text-on-surface-variant',
  'Business Affiliate Partner': 'bg-secondary-container text-primary-container',
  'Organic': 'bg-primary-fixed text-primary',
  'Branding - Walk In': 'bg-secondary-fixed text-on-secondary-fixed',
  'Inbound Phone call': 'bg-tertiary-container text-on-tertiary',
};
const pillClass = v => PILL[v] || (v.startsWith('Referral') ? 'bg-tertiary-fixed text-on-tertiary-fixed' : 'bg-surface-variant text-on-surface-variant');

function cell(v, c) {
  const px = c < 3 ? 'px-4' : 'px-5';
  if (c === 0) return `<td class="py-3 px-4 text-center font-semibold text-on-surface-variant">${esc(v)}</td>`;
  if (!v) return `<td class="py-3 ${px} text-outline">—</td>`;
  if (c === 2) return `<td class="py-3 px-4 text-on-surface-variant whitespace-nowrap">${esc(v)}</td>`;
  if (c === 4) return `<td class="py-3 px-5 text-on-surface whitespace-nowrap">${esc(v)}</td>`;
  if (c === SOURCE) return `<td class="py-3 px-5"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold whitespace-nowrap ${pillClass(v)}">${esc(v)}</span></td>`;
  if (c >= 15) return `<td class="py-3 px-5 text-center font-semibold text-primary">${esc(v)}</td>`;
  if (c >= 8) return `<td class="py-3 px-5 text-on-surface whitespace-nowrap">${esc(v)}</td>`;
  return `<td class="py-3 ${px} text-on-surface font-medium whitespace-nowrap">${esc(v)}</td>`;
}

function renderHead() {
  $('thead').innerHTML = HEADERS.map((h, c) => {
    const icon = sortCol === c ? (sortAsc ? 'arrow_upward' : 'arrow_downward') : 'unfold_more';
    return `<th scope="col" class="py-3.5 ${c < 3 ? 'px-4' : 'px-5'} font-semibold whitespace-nowrap ${c === 0 || c >= 15 ? 'text-center' : ''}">
      <button type="button" data-col="${c}" class="inline-flex items-center gap-1 uppercase tracking-wider hover:text-secondary-fixed">
        <span>${esc(h)}</span><span class="material-symbols-outlined text-[14px]">${icon}</span></button></th>`;
  }).join('');
}

function buildSourceMenu() {
  const counts = {};
  ROWS.forEach(r => { const k = r[SOURCE] || BLANK; counts[k] = (counts[k] || 0) + 1; });
  SOURCES = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const item = 'flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-surface-container-low cursor-pointer font-body-sm text-body-sm text-on-surface whitespace-nowrap';
  $('sourceMenu').innerHTML =
    `<label class="${item} border-b border-outline-variant/50 mb-1 pb-2 font-semibold"><input type="checkbox" id="srcAll" checked class="accent-[#273d36]"> Select all</label>` +
    SOURCES.map(k => `<label class="${item}"><input type="checkbox" data-source="${esc(k)}" checked class="accent-[#273d36]"> ${esc(k)} <span class="text-outline ml-auto pl-3">${fmt(counts[k])}</span></label>`).join('');
}

const selectedSources = () => [...document.querySelectorAll('#sourceMenu input[data-source]:checked')].map(i => i.dataset.source);

function updateSourceLabel(sel) {
  $('srcAll').checked = sel.length === SOURCES.length;
  $('srcAll').indeterminate = sel.length > 0 && sel.length < SOURCES.length;
  $('sourceLabel').textContent = sel.length === SOURCES.length ? 'All sources'
    : sel.length === 0 ? 'No source selected'
    : sel.length === 1 ? sel[0] : `${sel.length} sources selected`;
}

function apply() {
  const from = $('dFrom').value, to = $('dTo').value;
  const sel = new Set(selectedSources());
  updateSourceLabel([...sel]);
  // Date and source narrow everything, including the button counts
  const base = ROWS.filter(r => (!from || r[DATE] >= from) && (!to || r[DATE] <= to) && sel.has(r[SOURCE] || BLANK));
  const ones = col => fmt(base.filter(r => r[col] === '1').length);
  $('nQL').textContent = ones(16); $('nMS').textContent = ones(17); $('nMD').textContent = ones(18);
  VIEW = filterCol === null ? base : base.filter(r => r[filterCol] === '1');
  if (sortCol !== null) {
    VIEW = VIEW.slice().sort((a, b) => {
      const d = sortCol === 0 ? a[0] - b[0] : a[sortCol].localeCompare(b[sortCol], undefined, { numeric: true, sensitivity: 'base' });
      return sortAsc ? d : -d;
    });
  }
  page = 0;
  render();
}

function render() {
  const pages = Math.max(1, Math.ceil(VIEW.length / PAGE));
  page = Math.min(page, pages - 1);
  const start = page * PAGE, slice = VIEW.slice(start, start + PAGE);
  $('tbody').innerHTML = slice.map((r, i) =>
    `<tr class="${i % 2 ? 'bg-surface-container-low hover:bg-secondary-container' : 'bg-surface-container-lowest hover:bg-surface-container-low'} transition-colors duration-150">` +
    r.map(cell).join('') + '</tr>').join('');
  $('count').innerHTML = `Showing <strong class="text-on-surface font-semibold">${fmt(VIEW.length)}</strong> of ${fmt(ROWS.length)} records`;
  const n = s => `<span class="font-medium text-on-surface">${fmt(s)}</span>`;
  $('showing').innerHTML = VIEW.length ? `Showing ${n(start + 1)} to ${n(start + slice.length)} of ${n(VIEW.length)} records` : 'No records match the filters';
  renderPager(pages);
}

function renderPager(pages) {
  const icon = (p, name, off) => `<button type="button" data-page="${p}" ${off ? 'disabled' : ''} class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors disabled:opacity-40"><span class="material-symbols-outlined text-[18px]">${name}</span></button>`;
  const nums = [...new Set([0, 1, page - 1, page, page + 1, pages - 2, pages - 1])].filter(p => p >= 0 && p < pages).sort((a, b) => a - b);
  let html = icon(0, 'keyboard_double_arrow_left', page === 0) + icon(page - 1, 'chevron_left', page === 0);
  nums.forEach((p, i) => {
    if (i && p - nums[i - 1] > 1) html += '<span class="px-1 text-outline font-label-md text-label-md">...</span>';
    html += p === page
      ? `<span class="w-8 h-8 rounded-lg bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center">${p + 1}</span>`
      : `<button type="button" data-page="${p}" class="w-8 h-8 rounded-lg text-on-surface-variant hover:bg-surface-container-low font-label-md text-label-md flex items-center justify-center transition-colors">${p + 1}</button>`;
  });
  html += icon(page + 1, 'chevron_right', page >= pages - 1) + icon(pages - 1, 'keyboard_double_arrow_right', page >= pages - 1);
  $('pager').innerHTML = html;
}

function setFilterCol(col) {
  filterCol = col;
  document.querySelectorAll('.kpi').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.col) === filterCol)));
}

function exportCsv() {
  const csv = Papa.unparse({ fields: HEADERS, data: VIEW });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = 'MagickHome_Leads_Dashboard.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearFilters() {
  $('dFrom').value = ''; $('dTo').value = '';
  document.querySelectorAll('#sourceMenu input').forEach(i => { i.checked = true; });
}

$('dFrom').addEventListener('change', apply);
$('dTo').addEventListener('change', apply);
$('sourceMenu').addEventListener('change', e => {
  if (e.target.id === 'srcAll') document.querySelectorAll('#sourceMenu input[data-source]').forEach(i => { i.checked = e.target.checked; });
  apply();
});
document.addEventListener('click', e => { if (!$('source').contains(e.target)) $('source').open = false; });
$('clear').addEventListener('click', () => { clearFilters(); apply(); });
$('reset').addEventListener('click', () => { clearFilters(); setFilterCol(null); sortCol = null; sortAsc = true; renderHead(); apply(); });
$('export').addEventListener('click', exportCsv);
document.querySelectorAll('.kpi').forEach(btn => btn.addEventListener('click', () => {
  const col = Number(btn.dataset.col);
  setFilterCol(filterCol === col ? null : col);
  apply();
}));
$('thead').addEventListener('click', e => {
  const b = e.target.closest('button[data-col]'); if (!b) return;
  const c = Number(b.dataset.col);
  if (sortCol === c) sortAsc = !sortAsc; else { sortCol = c; sortAsc = true; }
  renderHead(); apply();
});
$('pager').addEventListener('click', e => {
  const b = e.target.closest('button[data-page]'); if (!b || b.disabled) return;
  page = Number(b.dataset.page); render();
  document.querySelector('.table-scroll').scrollTop = 0;
});

const getText = url => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject(url));

Promise.all([getText('data/leads.csv'), getText('data/call-center.csv')])
  .then(([leads, callCenter]) => {
    const cc = Papa.parse(callCenter, { header: true, skipEmptyLines: true }).data;
    CALL_CENTER_PHONES = new Set(cc.flatMap(r => phonesIn(clean(r['Phone number']))));
    MS_PHONES = new Set(cc.filter(r => MS_STATUSES.has(clean(r['Meeting Status'])))
      .flatMap(r => phonesIn(clean(r['Phone number']))));
    MD_PHONES = new Set(cc.filter(r => MD_STATUSES.has(clean(r['Meeting Status'])))
      .flatMap(r => phonesIn(clean(r['Phone number']))));
    const parsed = Papa.parse(leads, { header: true, skipEmptyLines: true, transformHeader: h => h.replace(/^\ufeff/, '').trim() });
    ROWS = parsed.data.filter(r => clean(r['Prospect ID']) || clean(r['Lead Name'])).map((r, i) => toRow(r, i));
    const dates = ROWS.map(r => r[DATE]).filter(Boolean).sort();
    $('dFrom').min = $('dTo').min = dates[0];
    $('dFrom').max = $('dTo').max = dates[dates.length - 1];
    buildSourceMenu(); renderHead(); apply();
  })
  .catch(url => { $('count').textContent = `Could not load ${url}`; });
</script>
</body>
</html>
